name: Publicar GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: src/java/pom.xml
      - run: npm ci
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, json, mbstring, xml, xmlwriter
          tools: composer:2.9.8
          coverage: none
      - run: npm test
      - run: ./src/java/mvnw -B -f src/java/pom.xml clean verify
      - run: ./src/kotlin/gradlew --no-daemon --console=plain -p src/kotlin clean check jar
      - run: composer --working-dir=src/php install --no-interaction --prefer-dist --no-progress --no-scripts
      - run: composer --working-dir=src/php check
      - name: Compilar e testar Swift no container temporário
        run: docker compose run --build --rm -T swift
      - name: Compilar e testar Pascal e seus dez exemplos no container temporário
        run: docker compose run --build --rm -T pascal
      - name: Compilar e testar C++ e seus dez exemplos com sanitizadores
        run: docker compose run --build --rm -T cpp
      - name: Verificar Go 1.27.2, testar em 64 e 32 bits e executar os dez exemplos
        run: docker compose run --build --rm -T go
      - name: Verificar Rust 1.92.0, testar debug e release e executar os dez exemplos
        run: docker compose run --build --rm -T rust
      - run: npm run docs:check
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
