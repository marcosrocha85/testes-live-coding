name: Testes e documentação
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node:
    name: JavaScript e TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run docs:check
      - run: npm run build
