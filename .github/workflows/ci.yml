name: Testes e documentação
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node:
    name: JavaScript e TypeScript
    runs-on: ubuntu-latest
    outputs:
      docker-languages: ${{ steps.docker-matrix.outputs.languages }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run docs:check
      - run: npm run build
      - name: Selecionar microprojetos Docker
        # Pascal e C++ incluem também os dez exemplos no comando padrão.
        id: docker-matrix
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { languages } = JSON.parse(readFileSync("docs/catalogo.json", "utf8"));
            console.log("languages=" + JSON.stringify(languages.filter(item => item.status === "implemented").map(item => item.id)));
          ' >> "$GITHUB_OUTPUT"
  docker:
    name: Docker ${{ matrix.language }}
    needs: node
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.node.outputs.docker-languages) }}
    steps:
      - uses: actions/checkout@v7
      - name: Executar todos os testes no container temporário
        run: docker compose run --build --rm -T "${{ matrix.language }}"
  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: src/java/pom.xml
      - run: ./src/java/mvnw -B -f src/java/pom.xml clean verify
  kotlin:
    name: Kotlin JVM 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: ./src/kotlin/gradlew --no-daemon --console=plain -p src/kotlin clean check jar
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, mbstring, xml, xmlwriter
          tools: composer:2.9.8
          coverage: none
      - run: composer --working-dir=src/php install --no-interaction --prefer-dist --no-progress --no-scripts
      - run: composer --working-dir=src/php check
  cpp:
    name: C++20 GCC 15.2.0
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: gcc:15.2.0@sha256:3ae15afe768b06d0c0fe088d822ba5f8045c26630bdacc8d8e7713cf5d8e7289
    steps:
      - uses: actions/checkout@v7
      - name: Preparar usuário sem privilégios no runner
        run: |
          useradd --create-home --uid 10001 runner
          chown -R runner:runner "$GITHUB_WORKSPACE"
      - name: Compilar fontes e executar testes e exemplos com sanitizadores
        run: runuser -u runner -- sh src/cpp/executar.sh check
  pascal:
    name: Pascal 3.2.2 Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Instalar Free Pascal e bibliotecas da mesma versão no runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fp-compiler-3.2.2=3.2.2+dfsg-32 \
            fp-units-rtl-3.2.2=3.2.2+dfsg-32 \
            fp-units-base-3.2.2=3.2.2+dfsg-32 \
            fp-units-fcl-3.2.2=3.2.2+dfsg-32
      - run: fpc -iV
      - run: sh src/pascal/executar.sh check
  swift:
    name: Swift 6.3.3 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: Importar chaves oficiais para verificar a distribuição Swift
        if: runner.os == 'Linux'
        run: curl --fail --silent --show-error --location --compressed --retry 3 https://www.swift.org/keys/all-keys.asc | gpg --import -
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc # v3
        with:
          swift-version: '6.3.3'
      - run: swift --version
      - run: swift test --package-path src/swift --jobs 2 -Xswiftc -warnings-as-errors
      - run: swift run --package-path src/swift --jobs 2 exemplo soma_de_dois
