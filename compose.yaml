name: testes-live-coding

services:
  javascript:
    profiles: [javascript]
    image: testes-live-coding-javascript:local
    build:
      context: .
      dockerfile: src/javascript/Dockerfile

  typescript:
    profiles: [typescript]
    image: testes-live-coding-typescript:local
    build:
      context: .
      dockerfile: src/typescript/Dockerfile

  java:
    profiles: [java]
    image: testes-live-coding-java:local
    build:
      context: .
      dockerfile: src/java/Dockerfile
    volumes:
      - java_maven:/home/runner/.m2

  kotlin:
    profiles: [kotlin]
    image: testes-live-coding-kotlin:local
    build:
      context: .
      dockerfile: src/kotlin/Dockerfile
    volumes:
      - kotlin_gradle:/home/runner/.gradle

  php:
    profiles: [php]
    image: testes-live-coding-php:local
    build:
      context: .
      dockerfile: src/php/Dockerfile

  swift:
    profiles: [swift]
    image: testes-live-coding-swift:local
    build:
      context: .
      dockerfile: src/swift/Dockerfile

volumes:
  java_maven:
  kotlin_gradle:
